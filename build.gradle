plugins {
	id "net.fabricmc.fabric-loom" version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Minecraft still references javax.annotation (JSR305) in places.
	implementation "com.google.code.findbugs:jsr305:3.0.2"

	// Sodium - compile-only, used by the optional X-Ray integration.
	// Not bundled: the Sodium mixins are only applied when Sodium is loaded,
	// and Sodium for MC 26.2 ships unobfuscated so no remapping is needed.
	compileOnly files("libs/sodium-fabric-0.9.2+mc26.2.jar")
}

loom {
	accessWidenerPath = file("src/main/resources/nova.accesswidener")
}

// Optional: relocate build output via the NOVA_BUILD_DIR environment variable.
// Useful when the drive holding the sources is low on disk space.
def novaBuildDir = providers.environmentVariable("NOVA_BUILD_DIR")
if(novaBuildDir.isPresent() && !novaBuildDir.get().isBlank())
	layout.buildDirectory = file(novaBuildDir.get())

tasks.withType(JavaCompile).configureEach {
	// Minecraft 26.1 upwards requires Java 25.
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
