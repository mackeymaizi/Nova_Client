plugins {
	// Minecraft 1.21.11 is still obfuscated, so it needs the classic
	// "remap" flavour of Loom (mappings + a remapJar step). The newer
	// "net.fabricmc.fabric-loom" plugin is for the unobfuscated era (26.2+).
	id "net.fabricmc.fabric-loom-remap" version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	// Official Mojang mappings keep the class and method names identical to
	// the 26.2 branch, which keeps this port as small as possible.
	mappings loom.officialMojangMappings()

	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Minecraft still references javax.annotation (JSR305) in places.
	implementation "com.google.code.findbugs:jsr305:3.0.2"
}

loom {
	accessWidenerPath = file("src/main/resources/nova.accesswidener")
}

// Optional: relocate build output via the NOVA_BUILD_DIR environment variable.
// Useful when the drive holding the sources is low on disk space.
def novaBuildDir = providers.environmentVariable("NOVA_BUILD_DIR")
if(novaBuildDir.isPresent() && !novaBuildDir.get().isBlank())
	layout.buildDirectory = file(novaBuildDir.get())

tasks.withType(JavaCompile).configureEach {
	// Minecraft 1.21.11 runs on Java 21.
	it.options.release = 21
	it.options.encoding = "UTF-8"
	it.options.compilerArgs += ["-Xmaxerrs", "3000"]
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
