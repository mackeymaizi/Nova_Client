# Gradle
# NOTE: The C: drive on the build machine is full, so Gradle's caches,
# native libraries and temporary files are redirected to D:. Adjust or
# remove these lines if you build on a machine with free C: space.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.native.dir=D:/gradle-nova/native

