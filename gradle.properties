# Gradle
# NOTE: The C: drive on the build machine is full, so Gradle's caches,
# native libraries and temporary files are redirected to E:. Adjust or
# remove these three lines if you build on a machine with free C: space.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.native.dir=E:/gradle-nova/native

# Fabric Properties
# https://fabricmc.net/develop/
minecraft_version=26.2
loader_version=0.19.5
loom_version=1.18-SNAPSHOT

# Fabric API
fabric_api_version=0.161.0+26.2

# Mod Properties
mod_version=1.3.4-MC26.2
maven_group=net.novaclient
archives_base_name=Nova-Client
