minecraft_version=1.21.11
loader_version=0.19.5
loom_version=1.18-SNAPSHOT

# Fabric API
fabric_api_version=0.141.6+1.21.11

# Mod Properties
mod_version=1.3.8-MC1.21.11
maven_group=net.novaclient
archives_base_name=Nova-Client
